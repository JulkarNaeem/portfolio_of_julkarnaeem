<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Julkar Naeem | Steel Structure Detailer</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages / Static Hosting
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      
      // Redirect to root with hash route so the SPA router handles it instantly
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#' +
        route + (l.search ? '?' + l.search.slice(1) : '')
      );
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; text-align: center; padding-top: 50px; color: #64748b;">
      Loading Julkar Naeem Portfolio...
    </p>
  </body>
</html>
